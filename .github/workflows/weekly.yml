name: Weekly dataset download

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: Where to read the current dataset from
        type: choice
        options: [huggingface, kaggle]
        default: huggingface

permissions:
  contents: read

concurrency:
  group: weekly-dataset
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: fferegrino/dataset-sync/fetch@v1
      with:
        # Scheduled runs have no inputs, so they always read from Hugging Face.
        from: ${{ inputs.source || 'huggingface' }}
        huggingface-dataset: feregrino/yugioh-cards
        kaggle-dataset: ioexception/yugioh-cards
        kaggle-username: ioexception
        kaggle-key: ${{ secrets.KAGGLE_KEY }}
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Download cards
      run: |
        python -m pip install --upgrade pip==26.2.1
        pip install -r requirements.txt
        cd data && python ../download.py
    - uses: fferegrino/dataset-sync/publish@v1
      with:
        huggingface-dataset: feregrino/yugioh-cards
        huggingface-card: dataset-card.md
        kaggle-dataset: ioexception/yugioh-cards
        kaggle-metadata: dataset-metadata.json
        huggingface-token: ${{ secrets.HF_TOKEN }}
        kaggle-username: ioexception
        kaggle-key: ${{ secrets.KAGGLE_KEY }}
