name: Weekly dataset download

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-dataset
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: fferegrino/kaggle-dataset-refresh@v1
      with:
        dataset: ioexception/yugioh-cards
        working-directory: data
        command: python ../download.py
        kaggle-key: ${{ secrets.KAGGLE_KEY }}
